run_prefix: tiny_aya_ja_ko_cpt_smoke
seed: 42

paths:
  output_root: outputs/posttrain

model:
  base_model: sshleifer/tiny-gpt2
  attn_implementation: eager

data:
  total_texts: 128
  min_total_texts: 32
  train_ratio: 0.9
  min_chars: 1
  max_chars: 2000
  dedup: true
  bucket_weights:
    ja_knowledge: 0.25
    ko_knowledge: 0.25
    ja_ko_instruction_mcq: 0.15
    en_replay: 0.25
    helper_transfer: 0.10
  mcq_dev:
    enabled: false

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  target_modules:
    - c_attn
    - c_proj
    - c_fc
  layers_to_transform:
    - 0
    - 1
  layers_pattern: h
  modules_to_save: []

training:
  max_seq_length: 256
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 20
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.02
  max_grad_norm: 1.0
  weight_decay: 0.0
  bf16: false
  gradient_checkpointing: false
  logging_steps: 5
  eval_steps: 10
  save_steps: 10
  save_total_limit: 2
  packing: true
  report_to: []

fallback:
  enabled: false
  qlora:
    per_device_train_batch_size: 1
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
    r: 4
    lora_alpha: 8
