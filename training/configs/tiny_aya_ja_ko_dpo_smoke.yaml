run_prefix: tiny_aya_ja_ko_dpo_smoke
seed: 42

paths:
  output_root: outputs/posttrain

model:
  base_model: sshleifer/tiny-gpt2
  attn_implementation: eager

data:
  target_langs:
    - ja
    - ko

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  target_modules:
    - c_attn
    - c_proj
    - c_fc
  layers_to_transform:
    - 0
    - 1
  layers_pattern: h
  modules_to_save: []

dpo:
  beta: 0.1
  loss_type: sigmoid

training:
  max_length: 512
  max_prompt_length: 256
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 20
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  bf16: false
  logging_steps: 5
  eval_steps: 10
  save_steps: 10
  report_to: []

time_gate:
  min_required_minutes: 0
